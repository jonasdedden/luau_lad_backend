# Non-published integration crate. It builds a real headless Bevy +
# bevy_mod_scripting app, dumps its reflection registry to a LAD file, and lets the
# tests convert that with `luau_lad_backend` and type-check scripts against
# the result. Kept separate so the published crate's dependency tree stays minimal.
[package]
name = "bevy_integration_test"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
luau_lad_backend = { path = ".." }

# Headless Bevy: ECS + reflection + asset loading + logging, no rendering.
bevy = { version = "0.19", default-features = false, features = [
    "std",
    "bevy_asset",
    "bevy_log",
] }

# bevy_mod_scripting (BMS), Luau backend: ECS + reflect bindings + core functions.
bevy_mod_scripting = { version = "0.21", default-features = false, features = [
    "lua",
    "luau",
    "core_functions",
    "bevy_ecs_bindings",
    "bevy_reflect_bindings",
] }

# Produces the reflection dump (`ScriptingFilesGenerationPlugin`); `ladfile` parses
# it back so the test can feed it to `luau_lad_backend`.
ladfile_builder = { version = "0.21", default-features = false }
ladfile = "0.21"
