name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Both round-trip tests skip themselves when `luau-lsp` is absent, so
      # without this step they would pass without ever checking anything — which
      # is exactly how a generated file that no longer parsed went unnoticed.
      - name: Install luau-lsp
        run: |
          curl -sSLf -o luau-lsp.zip \
            "https://github.com/JohnnyMorganz/luau-lsp/releases/download/$LUAU_LSP_VERSION/luau-lsp-linux-x86_64.zip"
          unzip -q luau-lsp.zip -d "$RUNNER_TEMP/luau-lsp"
          chmod +x "$RUNNER_TEMP/luau-lsp/luau-lsp"
          echo "LUAU_LSP=$RUNNER_TEMP/luau-lsp/luau-lsp" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/luau-lsp/luau-lsp" --version
        env:
          LUAU_LSP_VERSION: "1.69.0"

      # The workspace includes `bevy_integration_test`, which builds a real
      # headless Bevy + bevy_mod_scripting app and converts its reflection dump,
      # then type-checks scripts against the result with the binary above.
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  clippy:
    name: clippy (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The manifest is the single source of truth; this job checks with exactly
      # what it declares, so the two cannot drift.
      - name: Read rust-version from the manifest
        run: |
          msrv=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "luau_lad_backend") | .rust_version')
          [ -n "$msrv" ] && [ "$msrv" != "null" ] || {
            echo "::error::no rust-version in Cargo.toml"; exit 1;
          }
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - run: rustup toolchain install "$MSRV" --profile minimal

      # Check the *packaged* crate, not the workspace: `bevy_integration_test`
      # pulls deps that need a newer rustc, and building it here would mask the
      # published crate's real floor. `--no-verify` writes only the `.crate`
      # tarball, so unpack it ourselves — outside `target/`, or rust-cache's
      # cleanup walks the nested build tree.
      - run: cargo package -p luau_lad_backend --no-verify
      - run: mkdir -p "$RUNNER_TEMP/msrv" && tar -xzf target/package/luau_lad_backend-*.crate -C "$RUNNER_TEMP/msrv"
      - run: cd "$RUNNER_TEMP"/msrv/luau_lad_backend-*/ && cargo "+$MSRV" check --all-targets
