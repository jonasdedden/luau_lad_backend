[package]
name = "luau_lad_backend"
description = "Native Luau (.d.luau) definition-file backend for bevy_mod_scripting LAD files"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jonasdedden/luau_lad_backend"
homepage = "https://github.com/jonasdedden/luau_lad_backend"
keywords = ["bevy", "scripting", "luau", "ladfile"]
categories = ["game-development"]
readme = "README.md"
# Not a chosen policy so much as a floor: `ladfile` pulls in `bevy_ecs` 0.19,
# which declares `rust-version = "1.95"`. Verified by the `msrv` CI job, which
# fails if this and the toolchain it checks with drift apart.
rust-version = "1.95"

[dependencies]
# The LAD file format + the `LadFilePlugin` processor trait. The backend is pure
# string generation over these types, so this is the only runtime dependency.
#
# A range, not a caret: `ladfile` is a *public* dependency (its types appear in
# `lad_to_luau`'s signature and in the `LadFilePlugin` impl), so it has to unify
# with whatever version the dependent's `bevy_mod_scripting` pulls in. BMS and
# `ladfile` move in lockstep, so this span is BMS 0.20 through 0.21. BMS 0.17
# through 0.19 (`ladfile` 0.17–0.19) predate the `UntypedTuple` kind and are
# served by luau_lad_backend 0.1.
ladfile = ">=0.20, <0.22"
log = "0.4"

[[bin]]
name = "lad-luau"
path = "src/main.rs"

# The published crate depends only on `ladfile`. The fully-integrated Bevy +
# bevy_mod_scripting test lives in a separate, non-published workspace member so
# those heavy deps never enter this crate's tree. Run it with:
#   cargo test -p bevy_integration_test   (or `cargo test --workspace`)
[workspace]
members = ["bevy_integration_test"]
resolver = "2"
